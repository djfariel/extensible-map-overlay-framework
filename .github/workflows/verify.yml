name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: factorio-linux
    if: ${{ !github.event.pull_request.draft }}
    container:
      image: ghcr.io/djfariel/factorio-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: lua5.4 tools/run-unit-tests.lua

  headless-lifecycle:
    name: Headless Lifecycle Test
    runs-on: factorio-linux
    if: ${{ !github.event.pull_request.draft }}
    container:
      image: ghcr.io/djfariel/factorio-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package mod
        run: |
          MOD_NAME=$(jq -r '.name' info.json)
          MOD_VERSION=$(jq -r '.version' info.json)
          MOD_DIR="${MOD_NAME}_${MOD_VERSION}"
          
          mkdir -p mods
          mkdir -p "$MOD_DIR"
          
          # Copy mod files (excluding ignored files per info.json)
          rsync -a --exclude='.git' \
                   --exclude='.gitignore' \
                   --exclude='.idea' \
                   --exclude='.vscode' \
                   --exclude='.editorconfig' \
                   --exclude='README.md' \
                   --exclude='documentation.md' \
                   --exclude='description.md' \
                   --exclude='gallery' \
                   --exclude='thumbnail-large.png' \
                   --exclude='tools' \
                   --exclude='*.zip' \
                   . "$MOD_DIR/"
          
          # Create zip
          zip -r "mods/${MOD_DIR}.zip" "$MOD_DIR"
          
          echo "Packaged mod: ${MOD_DIR}.zip"

      - name: Create mod-list.json
        run: |
          cat > mods/mod-list.json << 'EOF'
          {
            "mods": [
              {
                "name": "base",
                "enabled": true
              },
              {
                "name": "extensible-map-overlay-framework",
                "enabled": true
              }
            ]
          }
          EOF

      - name: Run Factorio headless
        run: |
          timeout 180s /opt/factorio/headless/bin/x64/factorio \
            --mod-directory "$PWD/mods" \
            --create /tmp/test-save.zip || EXIT_CODE=$?
          
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "ERROR: Factorio timed out after 180 seconds"
            exit 1
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "ERROR: Factorio exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          echo "Factorio headless lifecycle test passed"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-logs
          path: |
            /tmp/factorio-*.log
            mods/
          if-no-files-found: ignore
